name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 面板手动触发
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署，新的 push 会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

# 所有 action 都用最新大版本（旧大版本目标 Node 20，在 Node 24 runner 上会失败）
jobs:
  # ------------------------------------------------------------------
  # 质量检查：独立 job，失败不阻塞部署
  # （便于区分「代码问题」和「运行环境问题」）
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 不用 pnpm/action-setup（目标 Node 20，在 Node 24 runner 上会失败）
      - name: Install pnpm
        run: npm install -g pnpm@12.3.4

      - name: Versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true ||
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify levels
        run: pnpm verify:levels

  # ------------------------------------------------------------------
  # 构建产物
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 不用 pnpm/action-setup（目标 Node 20，在 Node 24 runner 上会失败）
      - name: Install pnpm
        run: npm install -g pnpm@12.3.4

      - name: Versions
        run: |
          node --version
          pnpm --version

      # pnpm 10+ 默认禁止依赖执行构建脚本，而 esbuild 需要 postinstall 落地平台二进制。
      # 主路径用 CLI 参数放行；万一该 pnpm 版本不认这个参数，回退到
      # pnpm-workspace.yaml 里已经声明的 allowBuilds。
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true ||
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # vite.config.ts 会读取 GITHUB_REPOSITORY 自动推导 base = /<repo>/
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ------------------------------------------------------------------
  # 发布
  # ------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
